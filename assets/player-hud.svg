<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Meowster player profile</title><desc id="desc">A retro-futurist game HUD with player stats and pixel-inspired details.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset=".55" stop-color="#171d3a"/><stop offset="1" stop-color="#25134a"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42e8d4"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ffb86b"/></linearGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#9aa7ff" stroke-opacity=".09" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="300" rx="18" fill="url(#bg)"/><rect width="1000" height="300" rx="18" fill="url(#grid)"/>
<path d="M18 55V18H55 M945 18H982V55 M18 245V282H55 M945 282H982V245" fill="none" stroke="url(#line)" stroke-width="3"/>
<rect x="32" y="31" width="936" height="238" rx="12" fill="none" stroke="#8b9aff" stroke-opacity=".28"/>
<text x="58" y="65" font-family="monospace" font-size="13" letter-spacing="3" fill="#42e8d4">PLAYER PROFILE / 404</text>
<text x="55" y="135" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="57" fill="#f4f4ff">MEOWSTER</text>
<text x="59" y="166" font-family="monospace" font-size="16" fill="#b9c2ee">SOFTWARE DEVELOPER  •  AI / ML / WEB</text>
<rect x="59" y="190" width="286" height="34" rx="5" fill="#42e8d4" fill-opacity=".12" stroke="#42e8d4" stroke-opacity=".75"/>
<text x="73" y="212" font-family="monospace" font-size="13" font-weight="700" fill="#42e8d4">QUEST: BUILD SOMETHING USEFUL</text>
<g transform="translate(700 46)">
 <rect x="0" y="0" width="218" height="190" rx="10" fill="#0b1021" stroke="#8b5cf6" stroke-opacity=".8"/>
 <text x="18" y="25" font-family="monospace" font-size="11" letter-spacing="2" fill="#a9b4e8">PLAYER CLASS</text>
 <text x="18" y="48" font-family="monospace" font-size="17" font-weight="bold" fill="#fff">CODE ALCHEMIST</text>
 <g transform="translate(73 63)" shape-rendering="crispEdges">
  <rect x="20" y="0" width="30" height="10" fill="#42e8d4"/><rect x="10" y="10" width="50" height="10" fill="#42e8d4"/>
  <rect x="0" y="20" width="70" height="30" fill="#42e8d4"/><rect x="10" y="50" width="50" height="10" fill="#42e8d4"/>
  <rect x="10" y="20" width="10" height="10" fill="#171d3a"/><rect x="50" y="20" width="10" height="10" fill="#171d3a"/>
  <rect x="25" y="35" width="20" height="5" fill="#171d3a"/>
  <rect x="0" y="60" width="10" height="10" fill="#8b5cf6"/><rect x="60" y="60" width="10" height="10" fill="#8b5cf6"/>
  <rect x="10" y="70" width="20" height="10" fill="#8b5cf6"/><rect x="40" y="70" width="20" height="10" fill="#8b5cf6"/>
 </g>
 <text x="18" y="164" font-family="monospace" font-size="11" fill="#a9b4e8">XP</text>
 <rect x="45" y="154" width="150" height="8" rx="4" fill="#2d3457"/><rect x="45" y="154" width="112" height="8" rx="4" fill="url(#line)"/>
 <text x="18" y="181" font-family="monospace" font-size="10" fill="#42e8d4">STATUS: ONLINE</text>
</g>
<g fill="#ffb86b" filter="url(#glow)"><rect x="616" y="65" width="5" height="5"/><rect x="635" y="91" width="4" height="4"/><rect x="660" y="54" width="3" height="3"/><rect x="650" y="215" width="5" height="5"/></g>
<text x="58" y="251" font-family="monospace" font-size="11" letter-spacing="2" fill="#8894c5">PYTHON  /  TYPESCRIPT  /  ML  /  PRODUCT ENGINEERING</text>
<rect x="0" y="0" width="1000" height="5" rx="2" fill="url(#line)"/>
</svg>