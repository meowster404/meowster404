<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Abhijith Ramesh — Developer Interface</title>
<desc id="desc">Futuristic dark developer dashboard with neon cyan and violet lines, terminal motifs, and a digital grid.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset=".55" stop-color="#10152b"/><stop offset="1" stop-color="#160d2b"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f5ff"/><stop offset=".52" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff3cac"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#4c6fff" stroke-opacity=".14" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<rect width="1200" height="360" rx="22" fill="url(#grid)"/>
<path d="M0 275 L300 190 L520 240 L800 105 L1200 160" fill="none" stroke="url(#neon)" stroke-width="2" stroke-opacity=".75"/>
<path d="M0 300 L310 215 L515 265 L810 130 L1200 185" fill="none" stroke="#00f5ff" stroke-width="1" stroke-opacity=".28"/>
<g fill="none" stroke="url(#neon)" stroke-width="1.5" opacity=".85">
  <path d="M785 0V48H835V84H900"/><path d="M1000 0V35H1080V82H1200"/>
  <path d="M920 360V320H975V290H1050V260H1200"/><path d="M0 72H65V110H120V145H180"/>
</g>
<g fill="#00f5ff" filter="url(#glow)">
  <circle cx="835" cy="48" r="3"/><circle cx="900" cy="84" r="3"/><circle cx="1080" cy="82" r="3"/><circle cx="975" cy="290" r="3"/>
</g>
<g transform="translate(790 80)">
  <rect width="320" height="175" rx="12" fill="#080d1b" fill-opacity=".88" stroke="#6c63ff" stroke-opacity=".8"/>
  <path d="M0 34H320" stroke="#6c63ff" stroke-opacity=".5"/>
  <circle cx="18" cy="17" r="4" fill="#ff5f57"/><circle cx="33" cy="17" r="4" fill="#febc2e"/><circle cx="48" cy="17" r="4" fill="#28c840"/>
  <g font-family="monospace" font-size="12" fill="#91a4c7">
    <text x="18" y="61" fill="#00f5ff">$ whoami</text><text x="18" y="83" fill="#e7edff">abhijith_ramesh</text>
    <text x="18" y="109" fill="#00f5ff">$ focus --on</text><text x="18" y="131" fill="#d6c8ff">AI / ML · SOFTWARE · SYSTEMS</text>
    <text x="18" y="153" fill="#6e82a8">status: building something useful<span fill="#00f5ff">_</span></text>
  </g>
</g>
<g transform="translate(70 64)">
  <text x="0" y="0" font-family="monospace" font-size="13" letter-spacing="4" fill="#00f5ff">DEVELOPER PROFILE // 001</text>
  <text x="-2" y="72" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="800" fill="#f1f5ff">ABHIJITH</text>
  <text x="-2" y="124" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="800" fill="#f1f5ff">RAMESH<tspan fill="#00f5ff">.</tspan></text>
  <rect x="0" y="146" width="270" height="3" rx="1.5" fill="url(#neon)"/>
  <text x="0" y="178" font-family="monospace" font-size="16" fill="#a6b4d5">AI ENGINEERING  /  PRODUCT BUILDER</text>
  <text x="0" y="205" font-family="monospace" font-size="12" letter-spacing="2" fill="#64769f">LEARN // BUILD // ITERATE</text>
</g>
<text x="1140" y="330" text-anchor="end" font-family="monospace" font-size="10" letter-spacing="2" fill="#66749b">SYSTEM ONLINE ●</text>
</svg>